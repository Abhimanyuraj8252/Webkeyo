name: CI

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze > analyze.log 2>&1

      - name: Publish analyze issues to job summary
        if: always()
        run: |
          {
            echo '## flutter analyze'
            echo '```'
            grep -E "(error|warning|info) •" analyze.log | head -80
            tail -3 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if analyze found issues
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run tests
        id: test
        continue-on-error: true
        run: flutter test > test.log 2>&1

      - name: Publish test issues to job summary
        if: always()
        run: |
          {
            echo '## flutter test'
            echo '```'
            grep -E "\[E\]|Expected:|Actual:|Test failed" test.log | head -40
            tail -5 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: flutter build apk --debug > build.log 2>&1

      - name: Publish build errors to job summary
        if: always()
        run: |
          {
            echo '## flutter build apk --debug'
            echo '```'
            grep -nE "error:|Error:|FAILURE:|What went wrong|Compilation failed|Exception" build.log | head -60
            tail -10 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webkeyo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
